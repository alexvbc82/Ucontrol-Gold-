<style>
:root{--bg:#121212;--sf:#1E1E1E;--tx:#F3E9D2;--mu:#9A917D;--ac:#D4AF37;--on:#121212;--ok:#5FAF8A;--no:#D9694F;--wa:#E0A63C;--in:#4FA3B0;--gr:#9A9285;--hd:#121318}
body.l{--bg:#EADCC6;--sf:#F3E8D6;--tx:#7A2432;--mu:#8F5A62;--ac:#7A2432;--on:#F3E8D6;--ok:#4F6B2F;--no:#A8432A;--wa:#B7791F;--in:#1F6670;--gr:#6F675B}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif}
h2,h3{font-family:Georgia,serif;color:var(--ac);margin:4px 0 10px}
header{position:fixed;top:0;left:0;right:0;height:calc(80px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 14px 0;background:var(--hd);display:flex;align-items:center;justify-content:space-between;z-index:5}
header img{height:66px}header button{background:none;border:0;padding:6px}header svg{width:28px;height:28px}
main{padding:calc(92px + env(safe-area-inset-top)) 14px calc(96px + env(safe-area-inset-bottom))}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--hd);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{background:none;border:0;padding:8px 0 6px;color:#d9c487;font-size:9px;letter-spacing:-.3px;opacity:.5;min-width:0;padding-left:0;padding-right:0}nav button.on{opacity:1}
nav svg{width:25px;height:25px;display:block;margin:0 auto 2px}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;border:0;background:linear-gradient(#F6E3A1,#D4AF37 55%,#8A6A1E);color:#121212;font-size:32px;line-height:1;z-index:6;box-shadow:0 3px 10px #0006}
.card{background:var(--sf);border-radius:12px;padding:12px;margin-bottom:10px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.mu{color:var(--mu);font-size:12px}.big{font-family:Georgia,serif;font-size:26px;color:var(--ac)}
.pill{display:inline-block;border-radius:6px;padding:1px 8px;font-size:11px;color:var(--on);white-space:nowrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end}
.bx{background:var(--bg);width:100%;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
input,select,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #8886;background:var(--sf);color:var(--tx);font:inherit;margin:4px 0 10px}
label{font-size:12px;color:var(--mu)}
.bt{background:var(--ac);color:var(--on);border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:600}.bt.s{background:none;color:var(--ac);border:1px solid var(--ac)}
.bt.w{width:100%;margin-bottom:10px}
#sp{position:fixed;inset:0;background:#27262b;z-index:60;display:flex;align-items:center;justify-content:center;transition:opacity .5s}#sp img{max-width:100%;max-height:100%}
</style></head><body>

modal(`<h2>${esc(L[0].forn)}</h2><label>Telefone</label><input id="ft" type="tel" inputmode="numeric" value="${esc((db.fo||{})[k]||'(55) ')}"><div class="card"><div class="row"><span class="mu">Total comprado</span><b>${R(t)}</b></div><div class="row"><span class="mu">A pagar</span><b style="color:var(--no)">${R(ab)}</b></div></div><h3>Compras</h3>${L.map(s=>`<div class="card" onclick="saiForm('${s.id}')"><div class="row"><span>${esc(s.desc)||'Compra'}</span><span class="pill" style="background:${s.pago?'var(--ok)':'var(--wa)'}">${s.pago?'Pago':'A pagar'}</span></div><div class="row"><b style="color:var(--no)">− ${R(s.valor)}</b><span class="mu">${s.venc?'Vence '+D(s.venc):''}</span></div></div>`).join('')}<button class="bt w" onclick="back();setTimeout(()=>saiForm('','${encodeURIComponent(k)}'),60)">Nova compra deste fornecedor</button>`);
mask($('#ft'),v=>{db.fo=db.fo||{};db.fo[k]=v;save()})}
function del(t,id,b){if(t=='c'&&db.e.some(e=>e.cl==id))return toast('Este cliente tem encomendas. Altere ou exclua as encomendas antes.');if(!b.dataset.c){b.dataset.c=1;b.textContent='Toque de novo para excluir';setTimeout(()=>{b.dataset.c='';b.textContent='Excluir'},3500);return}const k={e:'e',c:'c',s:'s',a:'a'}[t];db[k]=db[k].filter(x=>x.id!=id);save();back()}
function cfgForm(){modal(`<h2>Configurações</h2><label>Nome que aparece no recibo</label><input value="${esc(db.cfg.nome||'')}" onchange="db.cfg.nome=this.value;save()"><label>Aparência</label><select onchange="db.cfg.tema=this.value;save();render()"><option value="e">Escuro (Noite Dourada)</option><option value="c" ${db.cfg.tema=='c'?'selected':''}>Claro (Areia e Marsala)</option></select>
<label>PIN de acesso (deixe vazio para remover)</label><input id="pin" type="password" inputmode="numeric" maxlength="8" value="${esc(db.cfg.pin||'')}"><button class="bt s w" onclick="db.cfg.pin=$('#pin').value;save();toast(db.cfg.pin?'PIN salvo.':'PIN removido.')">Salvar PIN</button>
<h3>Backup</h3><button class="bt w" onclick="down(JSON.stringify(db),'u-control-gold-backup-'+hj()+'.json','application/json')">Exportar dados</button><label class="bt s w" style="display:block;text-align:center">Importar dados<input type="file" accept=".json" hidden onchange="imp(this.files[0])"></label><button class="bt s w" onclick="csv()">Exportar planilha (CSV)</button><p class="mu">Para trocar de celular: exporte aqui, envie o arquivo e importe no novo aparelho.</p>`)}
function down(t,n,ty){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:ty}));a.download=n;a.click()}
let IMPD=null;
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.c||!d.e||!d.s)throw 0;IMPD=d;modal(`<h2>Importar backup</h2><p>Isso substitui todos os dados atuais pelos do arquivo escolhido.</p><div class="row"><button class="bt s" onclick="back()">Cancelar</button><button class="bt" onclick="doImp()">Substituir</button></div>`)}catch(e){toast('Arquivo de backup inválido.')}};r.readAsText(f)}
function doImp(){db=IMPD;db.cfg=db.cfg||{};db.a=db.a||[];save();location.reload()}
function csv(){const L=[['Tipo','Data','Descrição','Valor','Situação']];evs().forEach(x=>L.push([{r:'Recebimento',p:'Saída',e:'Entrega'}[x.t],D(x.d),x.x,x.v??'',x.pago?'Concluído':'Pendente']));down('\ufeff'+L.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n'),'u-control-gold.csv','text/csv')}
function lock(){if(!db.cfg.pin)return;const m=document.createElement('div');m.className='m';m.style.cssText='background:var(--bg);align-items:center;z-index:50';m.innerHTML='<div class="bx" style="border-radius:16px;margin:20px;background:var(--sf)"><h2>Digite seu PIN</h2><input id="pn" type="password" inputmode="numeric" maxlength="8"></div>';document.body.appendChild(m);$('#pn').oninput=e=>{if(e.target.value==db.cfg.pin)m.remove()}}
render();setTimeout(()=>{$('#sp').style.opacity=0;setTimeout(()=>$('#sp').remove(),500);lock()},1800);
</script></body></html>
